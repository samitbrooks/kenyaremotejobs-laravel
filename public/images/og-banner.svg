<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="1050" cy="150" r="220" fill="#f97316" opacity="0.18" filter="url(#glow)" />
  <circle cx="150" cy="500" r="260" fill="#3b82f6" opacity="0.15" filter="url(#glow)" />

  <!-- Decorative Grid Overlay -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="500" y1="0" x2="500" y2="630" />
    <line x1="700" y1="0" x2="700" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1100" y1="0" x2="1100" y2="630" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="450" x2="1200" y2="450" />
  </g>

  <!-- Logo & Wordmark -->
  <g transform="translate(100, 110)">
    <rect x="0" y="0" width="56" height="56" rx="14" fill="url(#brand)" />
    <!-- Compass / Globe Icon -->
    <path d="M 28 14 L 33 25 L 42 28 L 33 31 L 28 42 L 23 31 L 14 28 L 23 25 Z" fill="#ffffff" />
    
    <text x="72" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Kenya<tspan fill="#fb923c">Remote</tspan>Jobs
    </text>
  </g>

  <!-- Headline -->
  <g transform="translate(100, 240)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1.5" line-height="1.1">
      <tspan x="0" dy="0">Work from Kenya.</tspan>
      <tspan x="0" dy="68" fill="url(#brand)">Work for the World.</tspan>
    </text>
    
    <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94a3b8" letter-spacing="0">
      Online &amp; remote jobs scored for timezone overlap, location fit, and visa reality.
    </text>
  </g>

  <!-- Feature Pills -->
  <g transform="translate(100, 470)">
    <!-- Pill 1: Kenya-Friendly Match -->
    <g transform="translate(0, 0)">
      <rect width="260" height="48" rx="24" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <circle cx="28" cy="24" r="7" fill="#10b981" />
      <text x="46" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#f8fafc">
        Kenya-Friendly Match
      </text>
    </g>

    <!-- Pill 2: East Africa Time -->
    <g transform="translate(280, 0)">
      <rect width="240" height="48" rx="24" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="24" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#f8fafc">
        ⏰ EAT (UTC+3) Overlap
      </text>
    </g>

    <!-- Pill 3: USD Salaries -->
    <g transform="translate(540, 0)">
      <rect width="200" height="48" rx="24" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="24" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#f8fafc">
        💵 USD Salaries
      </text>
    </g>

    <!-- Pill 4: Direct Apply -->
    <g transform="translate(760, 0)">
      <rect width="210" height="48" rx="24" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="24" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#f8fafc">
        ⚡ 100% Free Browse
      </text>
    </g>
  </g>

  <!-- Domain Tag in Bottom Right -->
  <text x="1100" y="580" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#64748b" letter-spacing="0.5">
    kenyaremotejobs.com
  </text>
</svg>
