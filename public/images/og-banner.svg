<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c33" />
      <stop offset="50%" stop-color="#222949" />
      <stop offset="100%" stop-color="#0e1120" />
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3131" />
      <stop offset="100%" stop-color="#ff6b6b" />
    </linearGradient>
    <linearGradient id="brand-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3131" />
      <stop offset="100%" stop-color="#e11d27" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="1050" cy="150" r="240" fill="#ff3131" opacity="0.16" filter="url(#glow)" />
  <circle cx="150" cy="500" r="260" fill="#4f66a3" opacity="0.14" filter="url(#glow)" />

  <!-- Decorative Grid Overlay -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="500" y1="0" x2="500" y2="630" />
    <line x1="700" y1="0" x2="700" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1100" y1="0" x2="1100" y2="630" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="450" x2="1200" y2="450" />
  </g>

  <!-- Logo & Wordmark -->
  <g transform="translate(100, 105)">
    <!-- Target / Magnifier Emblem representation -->
    <circle cx="28" cy="28" r="24" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.9" />
    <circle cx="28" cy="28" r="16" fill="none" stroke="#ff3131" stroke-width="3.5" />
    <circle cx="28" cy="24" r="4.5" fill="#ffffff" />
    <path d="M 21 34 C 21 30, 35 30, 35 34 Z" fill="#ffffff" />
    <line x1="39" y1="39" x2="50" y2="50" stroke="#ff3131" stroke-width="4.5" stroke-linecap="round" />
    
    <text x="74" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Kenya<tspan fill="#ff3131">RemoteJobs</tspan>
    </text>
  </g>

  <!-- Headline -->
  <g transform="translate(100, 240)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1.5" line-height="1.1">
      <tspan x="0" dy="0">Work from Kenya.</tspan>
      <tspan x="0" dy="68" fill="url(#brand)">Work for the World.</tspan>
    </text>
    
    <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#a7b4cf" letter-spacing="0">
      Online &amp; remote jobs scored for timezone overlap, location fit, and visa reality.
    </text>
  </g>

  <!-- Feature Pills -->
  <g transform="translate(100, 470)">
    <!-- Pill 1: Kenya-Friendly Match -->
    <g transform="translate(0, 0)">
      <rect width="260" height="48" rx="24" fill="#202744" stroke="#ff3131" stroke-width="1.5" stroke-opacity="0.4" />
      <circle cx="28" cy="24" r="7" fill="#ff3131" />
      <text x="46" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#ffffff">
        Kenya-Friendly Match
      </text>
    </g>

    <!-- Pill 2: East Africa Time -->
    <g transform="translate(280, 0)">
      <rect width="240" height="48" rx="24" fill="#202744" stroke="#3b4d82" stroke-width="1.5" />
      <text x="24" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#f4f6fa">
        ⏰ EAT (UTC+3) Overlap
      </text>
    </g>

    <!-- Pill 3: USD Salaries -->
    <g transform="translate(540, 0)">
      <rect width="200" height="48" rx="24" fill="#202744" stroke="#3b4d82" stroke-width="1.5" />
      <text x="24" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#f4f6fa">
        💵 USD Compensation
      </text>
    </g>

    <!-- Pill 4: Direct Apply -->
    <g transform="translate(760, 0)">
      <rect width="210" height="48" rx="24" fill="#202744" stroke="#3b4d82" stroke-width="1.5" />
      <text x="24" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#f4f6fa">
        ⚡ 100% Free Browse
      </text>
    </g>
  </g>

  <!-- Domain Tag in Bottom Right -->
  <text x="1100" y="580" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#788cc1" letter-spacing="0.5">
    kenyaremotejobs.com
  </text>
</svg>
