<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3444da" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="70" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ambient Glow Orbs in Electric Cobalt -->
  <circle cx="1050" cy="150" r="280" fill="#3444da" opacity="0.22" filter="url(#glow)" />
  <circle cx="150" cy="500" r="260" fill="#3b82f6" opacity="0.12" filter="url(#glow)" />

  <!-- Decorative Grid Overlay -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="500" y1="0" x2="500" y2="630" />
    <line x1="700" y1="0" x2="700" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1100" y1="0" x2="1100" y2="630" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="450" x2="1200" y2="450" />
  </g>

  <!-- Logo & Wordmark -->
  <g transform="translate(100, 105)">
    <!-- Minimalist Vector Glyph -->
    <rect width="48" height="48" rx="14" fill="#3444da" />
    <circle cx="24" cy="24" r="14" fill="none" stroke="#ffffff" stroke-width="2" />
    <line x1="10" y1="24" x2="38" y2="24" stroke="#ffffff" stroke-width="2" />
    <ellipse cx="24" cy="24" rx="7" ry="14" fill="none" stroke="#ffffff" stroke-width="2" />
    
    <text x="66" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Kenya<tspan fill="#60a5fa">RemoteJobs</tspan>
    </text>
  </g>

  <!-- Headline -->
  <g transform="translate(100, 240)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1.5" line-height="1.1">
      <tspan x="0" dy="0">Work from Kenya.</tspan>
      <tspan x="0" dy="68" fill="url(#brand)">Work for the World.</tspan>
    </text>
    
    <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94a3b8" letter-spacing="0">
      Verified international remote roles scored for East Africa Time (UTC+3) compatibility.
    </text>
  </g>

  <!-- Feature Pills -->
  <g transform="translate(100, 470)">
    <!-- Pill 1: Kenya-Friendly Match -->
    <g transform="translate(0, 0)">
      <rect width="260" height="48" rx="24" fill="#1e293b" stroke="#3444da" stroke-width="1.5" stroke-opacity="0.8" />
      <circle cx="28" cy="24" r="6" fill="#3444da" />
      <text x="46" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
        Kenya-Friendly Match
      </text>
    </g>

    <!-- Pill 2: East Africa Time -->
    <g transform="translate(280, 0)">
      <rect width="240" height="48" rx="24" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <circle cx="28" cy="24" r="4" fill="#60a5fa" />
      <text x="44" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">
        EAT (UTC+3) Overlap
      </text>
    </g>

    <!-- Pill 3: USD Salaries -->
    <g transform="translate(540, 0)">
      <rect width="220" height="48" rx="24" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <circle cx="28" cy="24" r="4" fill="#34d399" />
      <text x="44" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">
        USD Compensation
      </text>
    </g>

    <!-- Pill 4: Direct Apply -->
    <g transform="translate(780, 0)">
      <rect width="200" height="48" rx="24" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <circle cx="28" cy="24" r="4" fill="#a78bfa" />
      <text x="44" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">
        Free To Browse
      </text>
    </g>
  </g>

  <!-- Domain Tag in Bottom Right -->
  <text x="1100" y="580" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#64748b" letter-spacing="0.5">
    kenyaremotejobs.com
  </text>
</svg>
